# Developer Cycle Time Dashboard — Configuration
# Copy to config.toml and edit for your org:
#   cp config.example.toml config.toml

# ── GitHub ─────────────────────────────────────────────────────────────────

[github]
# Path to a file containing a GitHub token (or set GITHUB_TOKEN env var).
# A fine-grained PAT scoped to the repos you want tracked works best: the
# repo list comes from what the token can read.
token_path = "~/.github_pat"

# Track every non-archived repo in this org that the token can read...
org = "your-org"
exclude_repos = []                # e.g. ["your-org/docs-site"]
# ...or list repos explicitly instead (overrides org discovery):
# repos = ["your-org/repo-a", "your-org/repo-b"]

# A repo seen for the first time is backfilled from this date.
history_start = 2025-01-01

# Optional: required-approval gates. A PR in `repo` needs an approval from
# a member of org team `team` (e.g. the CODEOWNERS `*` owner with "Require
# review from Code Owners" on). PRs created on/after `effective` are
# measured against the gate on the PR Flow tab. Reading team membership
# needs org "Members: read" on the token.
# [[github.approval_gates]]
# repo = "your-org/repo-a"
# team = "repo-a-approvers"
# effective = 2026-01-01

# Optional: GitHub Issues as the task tracker. Issues are searched in the
# same repos as PRs and scoped to the team by assignee. Remove this section
# (or set enabled = false) to turn the Delivery tab's data off.
[github.issues]
# Projects v2 Status values (case-insensitive) that mark work as started.
# Each project board has its own vocabulary; the earliest match wins.
in_progress_statuses = ["In Progress", "In Development", "In Review"]
# Container issue types, excluded from task metrics. Any issue with
# sub-issues is also treated as a container.
exclude_types = ["Epic"]

# ── Database ───────────────────────────────────────────────────────────────

[database]
# Path to SQLite DB (relative to project root or absolute)
path = "data/cycle_time.db"

# ── Team ───────────────────────────────────────────────────────────────────
# The dashboard reports on everyone in [[teams]] combined. More than one
# block is allowed (they're treated as one team).

[[teams]]
name = "My Team"
members = [
    "github-user-1",
    "github-user-2",
]
# Optional: people who left. Work they finished (PR merged/closed, issue
# closed, review submitted) before left_on stays attributed to the team.
# ETLs re-attribute stored history on every run, so roster edits apply
# retroactively without a backfill.
# former_members = [
#     { login = "github-user-0", left_on = "2026-10-01" },
# ]

# ── Dashboard (optional) ──────────────────────────────────────────────────

[dashboard]
title = "Developer Cycle Time Dashboard"
default_days = 30                 # Default date range on load
